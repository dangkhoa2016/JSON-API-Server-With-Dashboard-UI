name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"

      - run: yarn install --immutable

      - run: yarn check

      - run: yarn lint

      - run: yarn test:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: coverage/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          flags: node-${{ matrix.node-version }}
          fail_ci_if_error: false

  commit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "yarn"
      - run: yarn install --immutable
      - name: Test commit coverage verifier isolation
        run: yarn test:coverage-verifier
      - name: Check commit message
        run: |
          commits=$(scripts/select-commit-range.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ github.event.before }}" "${{ github.sha }}")
          if [ -n "$commits" ]; then
            while IFS= read -r commit; do
              git log --format='%B' -1 "$commit" | node scripts/check-commit-message.mjs /dev/stdin
            done <<< "$commits"
          fi
      - name: Check commit size
        run: |
          commits=$(scripts/select-commit-range.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ github.event.before }}" "${{ github.sha }}")
          if [ -n "$commits" ]; then
            while IFS= read -r commit; do
              MODE=commit BEFORE=$commit STRICT=true bash scripts/check-commit-size.sh
            done <<< "$commits"
          fi
      - name: Check per-commit coverage recovery
        run: |
          refs=$(scripts/select-commit-range.sh --refs "${{ github.event_name }}" "${{ github.base_ref }}" "${{ github.event.before }}" "${{ github.sha }}")
          mapfile -t range <<< "$refs"
          base="${range[0]}"
          head="${range[1]}"
          if [ -n "$base" ]; then
            bash manual-test-coverage/verify-commit-coverage.sh \
              "$base" "$head" \
              --project-root "$GITHUB_WORKSPACE" \
              --strict \
              --threshold 80 \
              --max-recovery-commits 2 \
              --timeout 600
          else
            bash manual-test-coverage/verify-commit-coverage.sh \
              --project-root "$GITHUB_WORKSPACE" \
              --strict \
              --threshold 80 \
              --max-recovery-commits 2 \
              --timeout 600
          fi
      - name: Post commit-policy summary
        if: always()
        run: |
          if [ -f manual-test-coverage/commit-policy-summary.md ]; then
            cat manual-test-coverage/commit-policy-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  container-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "yarn"

      - run: yarn install --immutable

      - run: yarn build

      - run: sh scripts/container-smoke-test.sh json-api-ci:smoke
        env:
          DATABASE_URL: file:./data/ci.db
